name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 26 }
    defaults:
      run:
        working-directory: skills/take
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: skills/take/package-lock.json
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx playwright install-deps chromium && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg coreutils
      - run: node bin/take doctor
      - name: Take uses Google Chrome
        run: node bin/take doctor | grep -q "Browser *Google Chrome" || { echo "::error::Take isn't using Google Chrome here"; exit 1; }
      - run: npm run typecheck
      - name: tests
        run: |
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then limit="timeout"; screen="xvfb-run -a"; else limit="gtimeout"; screen=""; fi
          failed=0
          for f in test/*.test.ts; do
            echo "::group::$f"
            start=$SECONDS
            $limit --kill-after=10 240 $screen node --test --test-timeout=180000 "$f"
            code=$?
            echo "::endgroup::"
            if [ $code -eq 124 ] || [ $code -eq 137 ]; then echo "::error::$f hung (stopped after $((SECONDS - start)) s)"; failed=1
            elif [ $code -ne 0 ]; then echo "::error::$f failed"; failed=1; fi
          done
          exit $failed
