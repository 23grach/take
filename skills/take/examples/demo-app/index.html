<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boards</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Boards</div>
    <nav class="nav" aria-label="Main">
      <a href="#" aria-current="page">Projects</a>
      <a href="#">Templates</a>
      <a href="#">Settings</a>
    </nav>
    <div class="avatar" aria-label="Signed in as Alex">A</div>
  </header>

  <main class="main">
    <div class="heading">
      <div>
        <h1>Projects</h1>
        <p class="count" id="count">3 projects</p>
      </div>
      <button class="btn btn-primary" id="new-project" type="button">
        <span aria-hidden="true">+</span> New project
      </button>
    </div>

    <ul class="grid" id="projects" aria-label="Projects">
      <li class="card"><span class="swatch" style="--c: #f2b8a2"></span><h2>Brand refresh</h2><p>Edited 2 days ago</p></li>
      <li class="card"><span class="swatch" style="--c: #a9c7f0"></span><h2>Onboarding flow</h2><p>Edited last week</p></li>
      <li class="card"><span class="swatch" style="--c: #b9dfb4"></span><h2>Pricing page</h2><p>Edited last month</p></li>
    </ul>
  </main>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <form id="form" novalidate>
      <h2 id="dialog-title">New project</h2>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="e.g. Moodboard" autocomplete="off">
      <p class="hint">You can rename it later.</p>
      <div class="actions">
        <button class="btn" type="button" id="cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="create" disabled>Create</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
